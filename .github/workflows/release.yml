# Builds release binaries for five targets and, on a `v*` tag, publishes them
# as a GitHub Release with that version's changelog entry as the notes.
# `workflow_dispatch` runs everything except the publish, so the machinery
# can be exercised on a branch without tagging anything.
#
# Hand-written rather than generated by cargo-dist. cargo-dist is maintained
# and can be told to use Blacksmith, but its workflow is generated output
# that must not be edited, cannot pin its actions to commit SHAs the way
# ci.yml does, and fetches the `dist` binary from a third party at release
# time. Five targets, one archive format each and one checksum is small
# enough to own outright and read top to bottom, which is the same judgement
# slice 3 made about the HTTP layer.
#
# Runner rules are the ones ci.yml explains: Linux on Blacksmith because the
# GitHub-hosted Linux credit pool is exhausted; macOS and Windows on
# GitHub-hosted runners, the sanctioned exception. The ARM Linux binary is
# cross-compiled on the x86-64 Blacksmith runner with the distribution's
# cross toolchain: the crate has no C dependencies, so that is all it needs.
# Actions are pinned to commit SHAs; the ref each was resolved from is in the
# comment beside it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that can fail cheaply fails here, before any build starts: a
  # tag that disagrees with Cargo.toml, or a changelog entry that is missing
  # or still undated.
  prepare:
    name: version and notes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: useblacksmith/checkout@a6f249f8370a56aa9dc4adfee19b3127d0f7f9ec # v1
      - name: Read the crate version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "crate version: $version"
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/release-notes.sh "$VERSION" | tee notes.md
      - name: Check the tag against Cargo.toml and the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$VERSION" ]; then
            echo "tag v$tag does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi
          if ! grep -Eq "^## \[$VERSION\] . [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md; then
            echo "CHANGELOG.md: the [$VERSION] heading needs a release date before tagging" >&2
            exit 1
          fi
      - name: Keep the notes for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  build-linux:
    name: build (${{ matrix.target }})
    needs: prepare
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - name: Check out
        uses: useblacksmith/checkout@a6f249f8370a56aa9dc4adfee19b3127d0f7f9ec # v1
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # branch 1.89.0
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Install the ARM64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Run the binary it built
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          "target/${{ matrix.target }}/release/knowmoretabs" --version
          "target/${{ matrix.target }}/release/knowmoretabs" --help > /dev/null
      - name: Package
        run: .github/scripts/package.sh "${{ matrix.target }}" dist
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowmoretabs-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The macOS runner is Apple silicon; the Intel binary is cross-compiled on
  # it, which Apple's toolchain supports directly, and not smoke-tested.
  build-desktop:
    name: build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            smoke: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            smoke: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            smoke: true
    defaults:
      run:
        shell: bash
    steps:
      # Same reason as ci.yml: the Windows image sets `core.autocrlf=true`,
      # which would change the bytes of the frontend assets the binary
      # embeds. A release binary must serve the assets as committed.
      - name: Keep line endings as they are committed
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the working tree holds the line endings it was committed with
        if: runner.os == 'Windows'
        run: |
          if git ls-files --eol | grep 'w/crlf'; then
            echo "checkout rewrote line endings; core.autocrlf must be false"
            exit 1
          fi
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # branch 1.89.0
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Run the binary it built
        if: matrix.smoke
        run: |
          bin="target/${{ matrix.target }}/release/knowmoretabs"
          if [ "$RUNNER_OS" = Windows ]; then bin="$bin.exe"; fi
          "$bin" --version
          "$bin" --help > /dev/null
      - name: Package
        run: .github/scripts/package.sh "${{ matrix.target }}" dist
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowmoretabs-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Only a tag gets here. `gh` is on the runner image already, so creating
  # the release needs no third-party action and no checkout.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, build-linux, build-desktop]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Collect the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: knowmoretabs-*
          path: dist
          merge-multiple: true
      - name: Collect the notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - name: Write one checksum file for every archive
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          rm ./*.sha256
          sha256sum -c SHA256SUMS
          ls -l
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "knowmoretabs $GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*
