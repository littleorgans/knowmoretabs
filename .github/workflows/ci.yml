# Standard GitHub-hosted runners. The repository is public, so those minutes
# are free. Linux jobs pin `ubuntu-24.04` and `ubuntu-24.04-arm` rather than
# `ubuntu-latest`: GitHub is moving the latest label to Ubuntu 26.04 between
# 19 Oct and 19 Nov 2026, and a pin keeps the image this workflow was written
# against. rustfmt and clippy judge the source, not the platform, so they
# run once on x86-64 Linux. Actions are pinned to commit SHAs; the ref each
# SHA was resolved from is in the comment beside it.
name: CI

on:
  pull_request:

# Pull requests are validated before merge. A merge commit on `main` does not
# need a second run, and a newer push to the same branch supersedes an older
# run that is still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # branch 1.89.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # branch 1.89.0
        with:
          components: clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Same command, same toolchain, no fmt and no clippy. `fail-fast: false`
  # because "Windows is broken and linux-arm is fine" is the answer worth
  # having, and cancelling the other jobs hides it.
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-24.04
          - name: linux-arm
            runner: ubuntu-24.04-arm
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # The Windows image sets `core.autocrlf=true` system-wide, which would
      # rewrite every checked-out file's line endings and so change the bytes
      # of the frontend assets the binary embeds and serves. The archive
      # writes LF on every platform and the repository stores LF; checkout
      # must not disagree.
      - name: Keep line endings as they are committed
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # branch 1.89.0
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.name }}
      # Not a belt-and-braces check on the step above: `include_str!` bakes
      # the frontend assets into the binary at build time, so a checkout that
      # rewrote them would ship CRLF in everything `export` writes, and
      # nothing else in the suite would notice.
      - name: Check the working tree holds the line endings it was committed with
        if: runner.os == 'Windows'
        run: |
          if git ls-files --eol | grep 'w/crlf'; then
            echo "checkout rewrote line endings; core.autocrlf must be false"
            exit 1
          fi
      - name: Test
        run: cargo test --workspace --all-targets --locked

  slices:
    name: xtask slices
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # branch 1.89.0
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check slice metadata and the generated matrix
        run: cargo run --locked --package xtask -- slices --check

  # The Tagger lab's pytest suite, with its shell and end to end tests run
  # against the binary built here (KMT_BIN). Windows is out: the lab's vector store needs
  # `fcntl`. linux-arm is out to bound cost: the locked torch pulls about
  # 3.1 GB of CUDA wheels on x86-64 Linux and about 0.2 GB on macOS, cached
  # by the lock. The tests load no model weights; the offline variables make
  # an accidental download fail fast. The browser cases run where the image
  # has Chrome. `prune-cache: false` keeps the downloaded wheels in the cache.
  lab:
    name: lab (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-24.04
          - name: macos
            runner: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # branch 1.89.0
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: lab-${{ matrix.name }}
      - name: Build knowmoretabs
        run: cargo build --locked
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: lab/tagger/uv.lock
          prune-cache: false
      - name: Install the lab
        run: uv sync --locked --project lab/tagger
      - name: Test the lab
        env:
          KMT_BIN: ${{ github.workspace }}/target/debug/knowmoretabs
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run --locked --project lab/tagger pytest -q lab/tagger/tests

  # The page derives what it shows from the library document, and Cargo
  # cannot run JavaScript. Node comes with the pinned image, so this needs
  # no toolchain and no third-party action; the tests use Node's own runner.
  # The toolbar extension's link building runs here too.
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test the renderer and the extension
        run: node --test tests/serve_frontend.cjs tests/extension.cjs
