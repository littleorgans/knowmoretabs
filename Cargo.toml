[package]
name = "knowmoretabs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Keep and search the browser tabs you have had open"
repository = "https://github.com/littleorgans/knowmoretabs"
homepage = "https://github.com/littleorgans/knowmoretabs"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["browser", "tabs", "chrome", "session", "archive"]
categories = ["command-line-utilities"]
# The crate ships the source, the tests and the three frontend assets the
# binary embeds at build time. Everything else is project material, not
# product: research, briefs, the vendored reference script, the frontend
# fixtures, the slice matrix and its lint, the classifier parity tool in
# `examples/`, and CI.
exclude = [
    "/.cargo/",
    "/.github/",
    "/.gitignore",
    "/docs/",
    "/examples/",
    "/reference/",
    "/slices.toml",
    "/web/NOTES.md",
    "/web/fixtures/",
    "/xtask/",
]

[workspace]
members = [".", "xtask"]
resolver = "3"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# Ctrl-C, and with `termination` SIGTERM and SIGHUP, for the commands that
# run other programs: those programs run in their own process group, so the
# terminal's signal no longer reaches them, and the handler ends them and
# removes their scratch before exiting (src/process_tree.rs). Installed
# through `try_set_handler`, so a signal inherited as ignored stays ignored.
# MIT OR Apache-2.0; on Unix it is built on the same `nix` as below.
ctrlc = { version = "3.5", features = ["termination"] }
directories = "6"
# The DOM `dom_smoothie` builds on, used directly for what readability does
# not do: the whole-page markdown when readability picks the wrong part of a
# page, and the classifier's look at scripts, forms and app mounts. The same
# version `dom_smoothie` requires, so the tree gains no second copy.
dom_query = { version = "0.28", default-features = false, features = ["markdown"] }
# Readability for `content`: a port of Mozilla's Readability that finds a
# page's main text and writes it as markdown, one crate for both
# (src/extract.rs). MIT, MSRV 1.75; chosen over `legible` and `readabilityrs`,
# which have no markdown output, and over `html2md`, whose GPL does not fit
# this crate's licence. Pure Rust, no network, no async.
dom_smoothie = "0.18"
# Decodes the one preview image `content` keeps of a page and writes it
# again as a small JPEG (src/image_fetch.rs). Pure Rust, no thread pool and
# no C: only the four formats the web serves images in, so AVIF (C or
# encode only) and the rest are left out. MIT OR Apache-2.0, MSRV 1.88.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
# Reads a copy of the browser's own `History` database; the archive itself
# stays JSON. `bundled` compiles one pinned SQLite into the binary, because
# Windows has no SQLite a program can rely on linking and the system library
# elsewhere varies in version from machine to machine
# (docs/briefs/slice-07b-history.md §2).
rusqlite = { version = "0.40", features = ["bundled"] }
# The colour management `image` already depends on, used directly to bring
# an image with its own colour profile into sRGB before it is kept
# (src/image_fetch.rs). BSD-3-Clause OR Apache-2.0; adds no crate.
moxcms = "0.8"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
# The WebSocket client for the DevTools protocol a headless browser speaks
# (src/cdp.rs): synchronous, over a loopback `TcpStream` polled to a deadline,
# with no TLS or async runtime; only the client handshake. MIT OR Apache-2.0.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# The HTTP client for `enrich` and `content`, the only commands that send
# anything. `rustls` with its bundled Mozilla roots, so TLS is compiled in on
# every platform and no system OpenSSL, certificate store or proxy is
# involved; no cookie jar, no gzip, no charset tables (src/fetch.rs,
# src/head.rs). A tilde pin because the resolver hook that refuses private
# addresses is in ureq's `unversioned` module, which may change in a minor
# release.
ureq = { version = "~3.4", default-features = false, features = ["rustls"] }
url = "2.5"

# Ends a program's whole process group, not only the program, so what it
# started goes with it (src/process_tree.rs). Only the signal module; the
# version `ctrlc` already brings, so the tree gains no crate. MIT.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
proptest = "1"

# Release binaries are what people download; keep them small. Nothing here
# changes what the program does.
[profile.release]
codegen-units = 1
lto = true
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
# These macros panic if the write fails, which kills a process over output
# nobody is reading. User-facing writes go through `out` instead.
print_stdout = "deny"
print_stderr = "deny"
