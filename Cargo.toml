[package]
name = "knowmoretabs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Keep and search the browser tabs you have had open"
repository = "https://github.com/littleorgans/knowmoretabs"
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace]
members = [".", "xtask"]
resolver = "3"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6"
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
