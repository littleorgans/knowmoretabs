# The vertical slice matrix.
#
# Rows are what someone wants. Slices are vertical cuts that deliver those rows
# end to end — CLI through parsing and storage to the rendered page — each one
# shippable on its own. The `future` band is what we have deliberately not
# built; it is there so that "not yet" is a recorded decision rather than an
# oversight.
#
# This file is the single source of truth. `docs/SLICES.md` is generated from
# it and `cargo xtask slices` enforces that source files agree with it. Never
# hand-edit the generated file.

[matrix]
title = "knowmoretabs"
tagline = "Every tab you ever had open, kept and searchable."

# --- What people want -------------------------------------------------------

[[capability]]
id = "save-now"
want = "Save what's open right now, in one command"

[[capability]]
id = "never-lose"
want = "Never lose a snapshot to a crash or a half-written file"

[[capability]]
id = "survive-updates"
want = "Keep working when my browser changes its format"

[[capability]]
id = "offline-forever"
want = "Read my archive offline, years from now"

[[capability]]
id = "find-old-page"
want = "Find a page I had open months ago"

[[capability]]
id = "when-and-where"
want = "See when and where a page was open"

[[capability]]
id = "forget-pages"
want = "Forget pages I don't want to see again"

[[capability]]
id = "triage-in-bulk"
want = "Clear a backlog without touching the terminal"

[[capability]]
id = "my-browser"
want = "Use the browser I actually use"

[[capability]]
id = "my-platform"
want = "Use it on my Linux box or my work Windows machine"

[[capability]]
id = "easy-install"
want = "Install it without installing a toolchain first"

[[capability]]
id = "tag-pages"
want = "Tag pages my way, and narrow the library by combining tags"

[[capability]]
id = "how-i-found-it"
want = "See how I found a page and how much I used it"

[[capability]]
id = "what-a-page-is"
want = "Know what a page is about without opening it"

[[capability]]
id = "keep-page-text"
want = "Keep what a page says, not just what it is called"

[[capability]]
id = "add-a-page"
want = "Add the page I am reading without saving every tab"

[[capability]]
id = "my-documents"
want = "Find my own notes and papers beside the pages I read, without copying them"

[[capability]]
id = "save-from-x"
want = "Keep what I bookmark on X without leaving X"

# --- Build order ------------------------------------------------------------

[[slice]]
id = "capture"
number = 1
title = "Capture a snapshot"
status = "done"
delivers = ["save-now", "never-lose", "survive-updates"]
depends_on = []
ships = """
`knowmoretabs save` finds the newest Chrome session on macOS, parses it, and
writes an immutable dated snapshot: the tabs as JSON plus a verbatim copy of
the session file. Tab groups — name, colour, membership — and each tab's
last-active time are parsed here because the data model is the thing hardest
to change later, even though nothing displays them until slice 2. A session
matching the previous snapshot is skipped. An interrupted run leaves the
archive exactly as it was. If Chrome's encrypted session files are newer than
its cleartext ones, the run refuses rather than saving stale tabs as current.
"""
intent = """
The tracer bullet. Everything downstream reads what this writes, so its data
model and its durability guarantees are the two decisions hardest to change
later. The project's foundation — workspace, lints, CI, the slice lint itself —
rides along here rather than becoming a horizontal slice of its own.
"""

[[slice]]
id = "library"
number = 2
title = "The offline library"
status = "done"
delivers = ["offline-forever", "find-old-page", "when-and-where"]
depends_on = ["capture"]
ships = """
`knowmoretabs export` writes a static site: every page you have ever had open,
listed once, with search, filters and a per-page history of the snapshots and
windows it appeared in. `knowmoretabs list` shows the same from the terminal.
Opens from `file://` with no server and no network.
"""
intent = """
This is where a pile of snapshots becomes a thing worth having. The frontend
built here is the same frontend slice 3 serves, so it is written to work
against either an embedded JSON blob or a fetch — one renderer, two hosts.
"""

[[slice]]
id = "triage"
number = 3
title = "Serve and triage"
status = "done"
delivers = ["forget-pages", "triage-in-bulk"]
depends_on = ["library"]
ships = """
`knowmoretabs serve` runs the library on 127.0.0.1 with the same assets and a
small JSON API. Forget and restore become real buttons with bulk selection and
undo. The `forget` and `restore` CLI commands do the same thing headlessly.
Snapshots are never touched: forgetting hides a page, it does not delete it.
"""
intent = """
The reason the project stopped being a script. Every feature asked for so far
points at a button on the page, and a button needs somewhere to POST to.
"""

[[slice]]
id = "browsers"
number = 4
title = "The browser you actually use"
status = "done"
delivers = ["my-browser"]
depends_on = ["capture"]
ships = """
Brave, Edge, Chromium and Vivaldi alongside Chrome, with profile discovery and
`--browser` / `--profile`, and a sensible answer when three browsers are
installed.
"""
intent = """
Pure reach. It is slice 4 rather than slice 1 because a second browser teaches
you nothing the first one did not, and it is cheap once the browser table is
the only thing that varies.
"""

[[slice]]
id = "platforms"
number = 5
title = "Linux and Windows"
status = "done"
delivers = ["my-platform"]
depends_on = ["browsers"]
ships = """
Session discovery on Linux and Windows, path handling that survives both, and
a CI matrix that proves it rather than assuming it.
"""
intent = """
Deferred this far because every platform doubles the CI bill and none of it is
testable without a real profile on a real machine. Doing it after the browser
table exists means one table gains a column, not three code paths.
"""

[[slice]]
id = "release"
number = 6
title = "Install it in one line"
status = "planned"
delivers = ["easy-install"]
depends_on = ["platforms"]
ships = """
Tagged releases with prebuilt binaries for macOS, Linux and Windows, a
changelog, install instructions that do not begin with "first install Rust",
and a crate ready to publish.
"""
intent = """
A personal tool published openly still has to be installable by someone who
does not care what it is written in. Publishing to a registry is a separate,
explicit decision — this slice builds the machinery and leaves the trigger
unpulled.
"""

[[slice]]
id = "tags"
number = 7
title = "Tags, and suggested tags"
status = "done"
delivers = ["tag-pages"]
depends_on = ["triage"]
ships = """
Tags you set, offline (7a): `knowmoretabs tag` puts flat tags on pages or
takes them off, `tags` manages the vocabulary, and `serve` gets a tag bar
whose counts show how the shown pages combine with each tag, chips on each
row, bulk tagging from the selection tray, and undo. `export` shows tags
read-only. Suggested tags (7c): `tag --prompt DIR` writes a work folder for an
agent the owner runs, and `tag --import` validates its answer whole and keeps
it in `tags/suggested.jsonl`, reviewed in `serve` with confirm and dismiss.
"""
intent = """
Tags are flat facets the owner controls; the meaning is in the combination,
so there is no hierarchy and no tag follows from another. The tool contains
no model and makes no request: tagging by machine is a handoff the owner
runs, and the owner's decisions always win over suggestions. Learning from
those decisions (7d) is not built.
"""

[[slice]]
id = "history"
number = 7
title = "History signals"
status = "done"
delivers = ["how-i-found-it"]
depends_on = ["capture", "library"]
ships = """
`save` copies the browser's `History` database with its journal and WAL and
records, for each tab, the search that led to it, the referrer, visit and
typed counts, first and last visit, and time in the foreground (7b, part
one). The library keeps its own record of those signals for every page in
`pages/history.json`, refreshed by each written save and by
`history --refresh`, and shows them in each page's drawer. `export` leaves out
searches and referrers unless `--with-history`; `save --no-history` reads
nothing.
"""
intent = """
Chrome forgets visits after about 90 days; a snapshot keeps them for as long
as the archive exists. It reads a copy of a browser file through a bundled
SQLite, with no network, so it brings neither storage nor `scale-index`
forward.
"""

[[slice]]
id = "enrich"
number = 7
title = "Enrich: what pages say about themselves"
status = "done"
delivers = ["what-a-page-is"]
depends_on = ["library"]
ships = """
`knowmoretabs enrich` fetches the `<head>` of library pages without cookies,
and for public GitHub repositories their topics and README, appending each
result to `pages/metadata.jsonl` and never fetching a page twice unless asked
(7b). `--dry-run` lists what would and would not be sent, and why;
`--limit N` caps a run. `tag --prompt` hands what it recorded to the tagging
agent.
"""
intent = """
One of the two commands that send anything off the machine, with `content`,
so it is opt-in and the decision of what never leaves is made before any
request: forgotten pages, this machine and the private network, search results
and URLs that carry a token stay home.
"""

[[slice]]
id = "content"
number = 8
title = "Content: what pages say"
status = "done"
delivers = ["keep-page-text"]
depends_on = ["library", "enrich"]
ships = """
`knowmoretabs content` captures the main text of library pages as markdown,
one file per page under `pages/content/`, with one line per attempt in
`pages/content.jsonl`. An X post is read from the public X post API: its
text, the post it quotes, an article's body, author, date and image
descriptions. A GitHub repository, issue, pull request or discussion is read
through `gh api` when gh is signed in: description, topics and README, or
the opening post and first comments. A YouTube video is read through
yt-dlp when it and deno or node are installed: its description and
chapters, and a transcript from one caption track, English first, else the
video's own language; without them videos wait. Plain HTTP reads every
other page, and
GitHub pages without gh: readability finds the main
text, and a page is recorded as ok, thin, an app shell, behind a login,
blocked, paywalled, not found or not HTML. A page that is an image is media,
its copy the page's image, and a PDF's text is read on this machine. Each page also keeps one preview
image, the best its route or its markup names (a post's photo, a video's
thumbnail, a repository's social preview, the head's image, else the main
text's largest), as a JPEG of at most 768 pixels under `pages/images/`, with
one line per attempt in `pages/images.jsonl`; `--no-images` skips them, and
`serve` shows each as a thumbnail from the archive.
Passing failures are retried in the run and on the next one. `--dry-run`,
`--limit` and `--refetch` keep `enrich`'s meaning, and `--url` captures one
page. A page that reads thin, or as an empty shell drawn by scripts, is then
rendered once in the local Chrome, headless on a scratch profile, every
connection it makes through a relay that keeps the private network out of
reach; the longer text wins, the line says `headless`, and without a browser
(or with `--no-browser`) those pages wait. `--signed-in` opens the pages a
public read found behind a login, paywalled or blocked in the owner's own
running Chrome, signed in, in hidden tabs of its own on the one connection
the owner allows, never a personal app, every line saying `signed_in`.
`doctor` says which ways of reading pages are ready and what the archive
holds.
"""
intent = """
Opt in, because it sends the URLs you visited to their own sites, X post
numbers to the X post API and video ids to YouTube, also downloads one
preview image per page from the address the page names, which may be on
another host, and stores page text and images privately; routes use
optional local tools when they are there (gh,
yt-dlp and the installed Chrome). `--signed-in` has the owner's own Chrome
open pages signed in, only when asked and only once the owner allows it. It
follows `enrich`'s rules for what never leaves the machine, through the
same guard, fetcher, planner and log writer, rather than a second copy of
them. Capture only: the markdown files are the store,
and keyword retrieval over them is the `fulltext` entry, not this slice.
"""

[[slice]]
id = "add"
number = 9
title = "Add one page"
status = "done"
delivers = ["add-a-page"]
depends_on = ["library", "triage"]
ships = """
`knowmoretabs add URL` puts one page in the library by its address, as one
line in `pages/added.jsonl`; the library lists every added page in one
snapshot, `added`, so tagging, forgetting, `content --url`, `serve` and
`export` take it like any other page. Then it captures the page's text and
image in the same run, as `content --url` does for that page: the same routes,
a browser render when it reads thin, and with `--signed-in` the owner's own
Chrome. A title the text was kept with joins the page's line when it had none.
A new page is kept under its address less trailing slashes, the fragment
(except an app route, `#/` or `#!`) and tracking parameters such as `utm_*`,
and a page held under an address that cleans the same is that page, so every
later stage and `--json` name the key the library holds; existing keys are
never rewritten. A page already in the library gets no line; its text is read again only after
an error, and a failed image is retried. An address that is not http or https,
one on this machine or the private network, and a forgotten page are refused,
writing nothing. `--retry content|image`, repeatable, retries a page already
in the library: no line, and only the stages named, each only where it failed,
the text after an error and the image after an error from the candidates it
kept, so a kept text or image is never fetched again and a text that fails
again cannot skip the image. `--no-content` stops after the library. `--title` keeps a
title the caller has, and `--json` gives one line per step as it happens
(the tier reading the page, each wait before a retry, how the text and the
image ended), the last saying how it all ended.
"""
intent = """
A snapshot is a whole session, copied verbatim and never written again, so a
single page cannot join one; a log the library folds in keeps that promise and
needs no schema change. It is the product side of quick add: the tagger lab
runs `add --json` and shows its lines as a progress bar. Its requests are
content's own, made by content's run narrowed to the page, so the page is
read by the rules every other page is.
"""

[[slice]]
id = "sources"
number = 10
title = "Local documents by reference, and search"
status = "done"
delivers = ["my-documents"]
depends_on = ["add", "library"]
ships = """
`knowmoretabs add --file` puts a local markdown, text or PDF document in the
library by reference: a file committed in a git repository with a remote as
`kmt-git:<repository>//<path>`, the repository named by its remote less
scheme, user, port and `.git`, pinned to its blob and commit in
`pages/sources.jsonl`; any other file, or text on stdin, copied once to a
shelf the owner names and kept as `kmt-blob:sha256-<hex>`. A file with changes
or not committed is refused, and so is a loose file with no shelf. Where each
repository is checked out, and the shelf, are one file per machine outside the
archive, `checkouts.json`. `knowmoretabs search --json` finds added pages and
documents by every word of a query in their title, key or text, the text read
live from the pinned bytes, ranked first by the model service when it is
given, and says of each document whether its text is fresh, stale or
unresolved, and why. `knowmoretabs read KEY...` prints the text of the pages
search lists, web pages and documents, one JSON line per key with `--json`;
the tagger lab embeds documents' text through it, and the Library drawer shows
the same text.
"""
intent = """
Research agents work from a separate archive and need their own notes and
papers back by what they say, without the archive becoming a second copy of
the owner's documents or a record of where they live. The archive keeps the
key and the pin; git and the shelf keep the bytes. Search reads only what was
added and the library state, never a snapshot or the History record, so an
agent is never handed the owner's browsing.
"""

[[slice]]
id = "x-bookmarks"
number = 11
title = "Save what I bookmark on X"
status = "building"
delivers = ["save-from-x"]
depends_on = ["add", "content", "tags"]
ships = """
Clicking X's own bookmark button on a post on x.com or twitter.com saves the
post to the library. The toolbar extension sees the click before X handles
it, names the post that owns the button and nothing else, and its service
worker posts it to `serve`'s `POST /api/x/bookmark`. The extension's origin,
pinned by the manifest's key, is the only origin besides the Library's own
that `serve` accepts. The post
is kept as one page under `https://x.com/<handle>/status/<id>`, the handle
in lower case, through `add`'s admission; removing a bookmark does nothing.
With the post the extension sends what the page shows of its author's
thread at the click, which `serve` checks and keeps as the page's text, read
signed in; when that read is missing, refused or may not be the whole
thread, the X post API is asked for the thread by the post's number, and
the longer text wins. A later bookmark of any post of a saved thread is the
same page. Each click is one line in `pages/xbookmarks.jsonl`, with the
thread's post numbers, and the Library is served each page's latest
bookmark time and clicked posts. A save requires `serve` to be running: a
bookmark made while it is stopped is not kept for later, and `doctor` says
how many were missed. The extension reports what it sees on X to `POST /api/x/health`, kept as
`extension.json`, and `doctor` says when it sees posts but no bookmark
button. The linked article, the note on x.com and the From X list follow.
"""
intent = """
Bookmarking on X is where the owner already says "keep this", so a second
step in the Library is the wrong cost. The extension stays a messenger: it
names a post, never a URL to fetch, and `serve` keeps every rule of what is
written and what leaves the machine, by the same paths `add` uses. X changes
its markup without notice, so the extension's health is part of the slice,
not an afterthought.
"""

# --- Prepared for, deliberately not built -----------------------------------

[[future]]
id = "live-tabs"
want = "See my live tabs exactly, not the last session written to disk"
prepared_by = ["capture", "browsers"]
why_not_now = """
Needs a browser extension, and it is the most direct route to what the product
is for: an extension sees the tabs on screen at that moment, on every Chromium
browser, before and after Chrome encrypts session storage. A session file lags
the screen by a flush, and is what can be read after a crash or with the
browser closed. Cost: a "Read your browsing history" prompt, a Web Store
listing with its fee and review queue, an install step per browser and
platform, and inverted control: stable Chrome lets no process pull tabs, so
the browser pushes on its own schedule and `save` from cron never sees live
tabs. The capture layer keeps its source abstract, so adding one is additive.
Design: docs/research/native-messaging.md.
"""

[[future]]
id = "arc"
want = "Use it with Arc"
prepared_by = ["browsers"]
why_not_now = """
Arc is Chromium-based and writes SNSS files, but only `Tabs_*` — its open-tab
model lives in `StorableSidebar.json`, a proprietary schema of Spaces and a
pinned sidebar. Parsing its session files would snapshot the wrong thing
convincingly, which is worse than not supporting it. Arc needs a second source
adapter, not a row in the browser table.
"""

[[future]]
id = "notes"
want = "Write myself a note about a page"
prepared_by = ["triage", "tags"]
why_not_now = """
`library.json` already carries per-URL user state: forgetting, then tags.
Tags shipped once triage was in daily use and the shape of what people want
to record was known; notes earn their place the same way, rather than guessed.
"""

[[future]]
id = "fulltext"
want = "Search what was on the page, not just its title"
prepared_by = ["content"]
why_not_now = """
Search over page text ships through the lab's model service:
`serve --model-port` forwards the Library query, and the Tagger's hybrid ranks
title, metadata and kept text. A Rust native index over the kept markdown
stays future, for search without the service (Windows, or the service
stopped), in memory first, then a rebuildable SQLite index if slow, as
`scale-index` says. The files stay the source of truth.
"""

[[future]]
id = "scale-index"
want = "Stay instant with years of snapshots"
prepared_by = ["library", "triage"]
why_not_now = """
Fifty snapshots of three hundred tabs is fifteen thousand rows; reading JSON
into memory is instant and costs no dependency, no migration and no corruption
mode. A rebuildable SQLite index is the answer when a measured query is slow,
and the JSON snapshots stay the source of truth when it arrives.
"""

[[future]]
id = "close-live-tabs"
want = "Close the tabs I have triaged, in the browser"
prepared_by = []
why_not_now = """
Requires driving the live browser, and makes a read-only tool capable of
destroying the thing it archives. If it is ever built it is opt-in, explicit,
and only after a snapshot has been taken.
"""

[[future]]
id = "encrypted-archive"
want = "Keep the archive encrypted at rest"
prepared_by = ["capture"]
why_not_now = """
The archive is a record of everything you browse. Today it is protected by
0700 and by never leaving the machine. Encryption means key management, which
means a way to lock yourself out of your own history. Worth doing properly or
not at all.
"""
